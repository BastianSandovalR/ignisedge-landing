<body>
<canvas id="lienzo" aria-hidden="true"></canvas>
<a class="marca" href="/"><i></i>IgnisEdge</a>
<section class="portada" id="portada">
  <h1>El viaje de una alerta.</h1>
  <p>Ponte en el lugar del bosque, del nodo y del dron. En dos minutos recorres cómo IgnisEdge detecta un incendio antes de la llama.</p>
  <div class="botones">
    <button class="vr" id="entrarVR" type="button" disabled>Entrar en realidad virtual</button>
    <button class="pantalla" id="verAqui" type="button">Ver en esta pantalla</button>
  </div>
  <p class="aviso" id="avisoVR">Buscando un visor compatible…</p>
</section>
<div class="ayuda" role="status"><span>Arrastra para mirar alrededor · clic o espacio para avanzar</span><button type="button" id="salir">Salir</button></div>

/* ---------- utilidades ---------- */
function hash(x, y){ const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }

const bosque = new THREE.Scene();

// terreno, camino y central (misma geografía que la página principal)
const NODO = V(0, 0, 0), FOCO = V(5, 0, -4), GATEWAY = V(48, 0, -42);

/* ---------- vegetación liviana para el visor ---------- */

let oyente = null, sonidos = {};
function bufferDe(ctx, seg, fn){ const n = Math.floor(ctx.sampleRate * seg), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0); fn(d, ctx.sampleRate); return b; }
function iniciarSonido(){
  if (oyente) return;

  const ctx = oyente.context, sr = ctx.sampleRate;
  const viento = bufferDe(ctx, 6, d => { let u = 0; for (let i = 0; i < d.length; i++){ u = (u + .02 * (Math.random() * 2 - 1)) * .996; d[i] = u * 3.2 * (.7 + .3 * Math.sin(i / sr * 6.283 * .13)); } });
  const grillos = bufferDe(ctx, 4, (d, sr) => { for (let k = 0; k < 9; k++){ const t0 = Math.random() * 3.6; for (let p = 0; p < 3; p++){ const s = Math.floor((t0 + p * .045) * sr); for (let i = 0; i < sr * .025 && s + i < d.length; i++) d[s + i] += Math.sin(i / sr * 6.283 * 4600) * Math.sin(Math.PI * i / (sr * .025)) * .09; } } });
  const crepitar = bufferDe(ctx, 3, (d, sr) => { for (let k = 0; k < 140; k++){ const s = Math.floor(Math.random() * (d.length - 400)), a = Math.random() * .6; for (let i = 0; i < 300; i++) d[s + i] += (Math.random() * 2 - 1) * a * Math.exp(-i / 40); } for (let i = 0; i < d.length; i++) d[i] += (Math.random() * 2 - 1) * .015; });
  const rotor = bufferDe(ctx, 2, (d, sr) => { for (let i = 0; i < d.length; i++){ const t = i / sr; let v = 0; for (const f of [165, 330, 495]) v += ((t * f) % 1 - .5) / (f / 165); d[i] = v * .22 * (.85 + .15 * Math.sin(t * 6.283 * 9)) + (Math.random() * 2 - 1) * .05; } });
  const ambiente = (buf, vol) => { const a = new THREE.Audio(oyente); a.setBuffer(buf); a.setLoop(true); a.setVolume(vol); a.play(); return a; };
  sonidos.viento = ambiente(viento, .35); sonidos.grillos = ambiente(grillos, .5);
  const pos = (buf, obj, ref, vol) => { const a = new THREE.PositionalAudio(oyente); a.setBuffer(buf); a.setLoop(true); a.setRefDistance(ref); a.setVolume(vol); obj.add(a); a.play(); return a; };

}
function bip(frec = 880, dur = .12, vol = .18){
  if (!oyente) return; const ctx = oyente.context, o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;

    entrar(){ colocar(PUESTOS.bosque, FOCO); mostrarSolo(paneles.bosque); ubicarEnRig(paneles.bosque, -1.35, 1.5, -2.1); } },
  { nombre: 'nodo', duracion: 24,
    entrar(){ colocar(PUESTOS.nodo, FOCO); mostrarSolo(paneles.nodo, grafico); ubicarEnRig(paneles.nodo, -1.45, 1.5, -1.9); ubicarEnRig(grafico, 1.25, 1.42, -1.8); anomaliaPrevia = false; } },
  { nombre: 'red', duracion: 26,
    entrar(){ const p = V(-34, 0, 44); colocar(p, V(8, 0, -14), 34); plataforma.position.copy(rig.position); plataforma.rotation.y = rig.rotation.y; plataforma.visible = true; mostrarSolo(paneles.red); ubicarEnRig(paneles.red, -1.3, 1.45, -1.9); bipsLora = 0; },
    salir(){ plataforma.visible = false; } },
  { nombre: 'dron', duracion: 30,
    entrar(){ const base = drones[0].position.clone(); rig.position.copy(base).add(V(0, .45 - ALTURA_OJOS, 0)); rig.rotation.set(0, Math.atan2(-(PUNTO_DRON.x - base.x), -(PUNTO_DRON.z - base.z)), 0); rig.updateMatrixWorld();
      paneles.dron.userData.dibujar('Ahora eres el dron.', 'El operador autorizó el vuelo. Despegas desde la central portátil hacia el punto que marcaron los nodos.');
      mostrarSolo(paneles.dron); avisado = false; drones[0].visible = false; rig.add(dronPropio); },
    salir(){ uTerm.value = 0; drones[0].visible = true; rig.remove(dronPropio); vineta.material.uniforms.uFuerza.value = 0; if (sonidos.rotor) sonidos.rotor.setVolume(0); } },
  { nombre: 'sala', duracion: 46,
    entrar(){ cambiarEscena(sala); rig.position.set(0, 0, 0); rig.rotation.set(0, 0, 0); rig.updateMatrixWorld(); paneles.sala.userData.dibujar('Una persona decide.', 'La central muestra todo en un gemelo digital: los nodos, el foco y el vuelo del dron. IgnisEdge entrega la información; la decisión es de una persona.', ''); ubicarEnRig(paneles.sala, 0, 2.05, -2.35); paneles.sala.visible = true; },
    salir(){ cambiarEscena(bosque); } },
];
const ALTURA_OJOS = 1.55;
// tú eres la cámara del dron: el cuerpo y las hélices quedan sobre tu cabeza, la vista hacia abajo queda libre
const dronPropio = crearDron(); dronPropio.position.set(0, ALTURA_OJOS + .42, .35); dronPropio.scale.setScalar(1.3);
function cambiarEscena(e){ escenaActiva = e; e.add(rig); }

let idx = 0, tEst = 0, transicion = { fase: 'in', t: 0 };
function irA(i){ if (transicion) return; transicion = { fase: 'out', t: 0, destino: i }; }
function avanzar(){ if (idx === 0) irA(1); else if (idx === ESTACIONES.length - 1 && tEst > 14) irA(0); else if (idx < ESTACIONES.length - 1) irA(idx + 1); }
function entrarEstacion(i){ ESTACIONES[idx].salir?.(); idx = i; tEst = 0; ESTACIONES[i].entrar(); }

/* ---------- actualización por estación ---------- */
function actualizar(dt, t){
  const est = ESTACIONES[idx].nombre;
  // valores base del bosque en calma
  let malla = 0, det = 0, tri = 0, l1 = 0, l2 = 0, sensor = 0;
  if (est === 'bosque') sensor = ss(tEst, 8, 16) * .6;
  if (est === 'nodo'){ const an = dibujarGraficoLimitado(tEst); det = an ? 1 : 0; sensor = .8; if (an && !anomaliaPrevia){ bip(1040, .14); setTimeout(() => bip(780, .18), 160); } anomaliaPrevia = an; }
  if (est === 'red'){ malla = ss(tEst, 0, 2); det = 1; tri = ss(tEst, 3, 9); l1 = ss(tEst, 12, 15.5); l2 = ss(tEst, 15, 18.5); sensor = .6;
    if (l1 > .05 && bipsLora === 0){ bip(988, .1); bipsLora = 1; } if (l2 > .5 && bipsLora === 1){ bip(1318, .16); bipsLora = 2; } }
  if (est === 'dron') actualizarDron(dt, t);
  const nieblaObjetivo = est === 'red' ? .0055 : est === 'dron' ? .009 : .016;
  bosque.fog.density = lerp(bosque.fog.density, nieblaObjetivo, transicion ? 1 : Math.min(1, dt * 2));
  // nodos y red
  haces.material.opacity = malla * .2;
  NODOS.forEach((n, i) => { const b = balizas[i], k = DETECTORES.indexOf(n), activo = k >= 0 && (k === 0 ? det : tri) > .25, pulso = .5 + .5 * Math.sin(t * (activo ? 7 : 1.6) + b.userData.fase);
    b.material.color.copy(activo ? (pulso > .5 ? AMARILLO : NARANJA) : VERDE).multiplyScalar(activo ? 2.4 : 1.4); b.material.opacity = malla * (activo ? .95 : .45 + .35 * pulso); b.scale.setScalar(activo ? 4 : 2.4 + .6 * pulso); });
  const ciclo = (t * .55) % 1; ondaNodo.material.opacity = det * (1 - ciclo) * .8 * (est === 'nodo' ? 1 : 0); ondaNodo.scale.setScalar(1 + ciclo * 7);
  circulos.forEach((c, i) => { const rev = clamp(tri * 1.5 - i * .18, 0, 1), total = c.geometry.index.count; c.geometry.setDrawRange(0, Math.floor(total * rev / 3) * 3); c.material.opacity = rev > 0 ? .9 : 0; });
  const conv = ss(tri, .55, 1); estimado.material.opacity = conv * .9; estimado.scale.setScalar(lerp(14, 2, conv) + Math.sin(t * 5) * .2 * conv);
  const pintarEnlace = (en, nivel, vel) => { en.tubo.material.opacity = nivel * .8; en.paquetes.forEach(p => { const f = (p.userData.f + t * vel) % 1; en.curva.getPoint(f, p.position); p.material.opacity = nivel * Math.sin(f * Math.PI); }); };
  enlaces.forEach(en => pintarEnlace(en, l1, .32)); pintarEnlace(enlaceCentral, l2, .26);
  haloGw.material.opacity = l1 * (.4 + .4 * Math.sin(t * 6));
  balizaCentral.material.opacity = Math.max(malla * .7, l2) * (.6 + .4 * Math.sin(t * (l2 > .3 ? 7 : 1.4))); balizaCentral.scale.setScalar(4 + l2 * 3);
  nodo.userData.led.material.color.copy(det > .3 ? (Math.sin(t * 9) > 0 ? AMARILLO : NARANJA) : VERDE).multiplyScalar(3);
  matHumo.uniforms.uSensor.value = sensor * (1 - uTerm.value);
  // brasa y gases
  const parpadeo = .75 + Math.sin(t * 7.3) * .12 + Math.sin(t * 13.1) * .08;
  matLena.emissiveIntensity = 2.6 * parpadeo; ceniza.material.emissiveIntensity = 1.4 * parpadeo; grietas.offset.set(t * .01, t * .007);
  luzBrasa.intensity = 12 * parpadeo; halo.material.opacity = .45 * parpadeo;
  for (let i = 0; i < NG; i++){
    hVida[i] += dt * (.05 + (i % 5) * .008); if (hVida[i] > 1) hVida[i] -= 1;
    const v = hVida[i], sm = hSem[i], giro = sm + v * 4 + t * .2, r = .2 + v * 2.2;
    hp.set([FOCO.x + Math.cos(giro) * r + v * v * 5 + Math.sin(v * 7 + sm) * .5, FOCO.y + .3 + v * 13, FOCO.z + Math.sin(giro) * r - v * v * 2], i * 3);
    hTam[i] = .8 + v * 5 + (sm % 1) * .8; hAlfa[i] = ss(v, 0, .15) * Math.pow(1 - v, 1.5) * .09; hRot[i] = sm + v * 1.8 * ((i & 1) ? 1 : -1); hCal[i] = Math.pow(1 - v, 4) * .8;
  }
  for (const n of ['position', 'aTam', 'aAlfa', 'aRot', 'aCal']) geoHumo.attributes[n].needsUpdate = true;
  // gemelo digital
  if (est === 'sala'){
    const p = (t % 1.6) / 1.6, pul = focoMaqueta.userData.pulso; pul.scale.setScalar(.02 + p * .12); pul.material.opacity = 1 - p;
    const mini = focoMaqueta.userData.mini; mini.position.y = aMaqueta(FOCO).y + .09 + Math.sin(t * 2) * .004; mini.userData.helices.forEach((h, k) => h.rotation.y = t * 40 + k);
    maqueta.rotation.y = Math.sin(t * .1) * .12;
    if (tEst > 16 && !paneles.sala.userData.final){ paneles.sala.userData.final = true; paneles.sala.userData.dibujar('Gracias por recorrer IgnisEdge.', 'Detectamos incendios forestales antes de la llama, con sensores en el bosque, una red LoRa y drones con visión térmica. Conoce más en ignisedge.pro', 'Aprieta el gatillo para volver a empezar'); }
  } else paneles.sala.userData.final = false;
}
let ultimoGrafico = -1, anomaliaGuardada = false;
function dibujarGraficoLimitado(t){ if (t - ultimoGrafico > .1 || t < ultimoGrafico){ anomaliaGuardada = dibujarGrafico(t); ultimoGrafico = t; } return anomaliaGuardada; }

// vuelo del dron: despegue vertical suave, crucero a velocidad pareja y vuelo estacionario frente al foco
function actualizarDron(dt, t){
  const base = drones[0].position, alto = base.clone().add(V(0, 10, 0)), destino = PUNTO_DRON.clone(); destino.y = FOCO.y + 10.5;
  const te = tEst, subir = ss(te, 4, 8.5), avanzar = ss(te, 8.5, 16.5);
  const p = base.clone().lerp(alto, subir); if (avanzar > 0) p.copy(alto).lerp(destino, avanzar);
  p.y += .45 - ALTURA_OJOS + Math.sin(t * 1.8) * .05 * ss(te, 4, 5);
  rig.position.copy(p); rig.updateMatrixWorld();
  const girando = te > 1.5;
  dronPropio.userData.helices.forEach((h, k) => h.rotation.y = girando ? t * 45 + k : k);
  dronPropio.userData.discos.forEach(d => d.material.opacity = girando ? .12 : 0);
  if (sonidos.rotor){ sonidos.rotor.setVolume(girando ? .55 : 0); }
  const velocidad = Math.max(ss(te, 4.2, 5.5) * (1 - ss(te, 7.8, 8.5)), ss(te, 8.6, 9.6) * (1 - ss(te, 15.4, 16.5)));
  vineta.material.uniforms.uFuerza.value = velocidad * .7;
  uTerm.value = ss(te, 17.5, 18.5);
  if (te > 18.6 && !avisado){ avisado = true; bip(1318, .16); setTimeout(() => bip(1568, .22), 180);
    paneles.dron.userData.dibujar('Foco confirmado.', 'Mira hacia abajo: tu cámara térmica ve el calor de la brasa entre los árboles fríos. El modelo distingue un foco real por cómo parpadea su calor.', 'Alerta enviada a la central y a los celulares de turno'); avisarCelulares(); }
  if (te < 1) ubicarEnRig(paneles.dron, -1.2, 1.55, -2.1);
  if (te > 17 && te < 17.6) ubicarEnRig(paneles.dron, 0, 1.75, -2.3);
}

/* ---------- bucle ---------- */
const reloj = new THREE.Clock();
function cuadro(){
  const dt = Math.min(reloj.getDelta(), .05), t = reloj.elapsedTime;
  uT.value = t;
  if (!congelar){ tEst += dt; if (ESTACIONES[idx].duracion && tEst > ESTACIONES[idx].duracion && !transicion){ if (idx < ESTACIONES.length - 1) irA(idx + 1); } }
  if (idx === ESTACIONES.length - 1 && tEst > ESTACIONES[idx].duracion && !transicion) irA(0);
  if (transicion){
    transicion.t += dt;
    if (transicion.fase === 'out'){ velo.material.opacity = ss(transicion.t, 0, .6); if (transicion.t >= .65){ entrarEstacion(transicion.destino); transicion = { fase: 'in', t: 0 }; } }
    else { velo.material.opacity = 1 - ss(transicion.t, .1, .8); if (transicion.t >= .8) transicion = null; }
  }
  actualizar(dt, t);
  const visiblesPanel = [...Object.values(paneles), grafico];
  visiblesPanel.forEach(p => { if (p.visible) p.material.opacity = Math.min(1, ss(tEst, .3, 1.2) * 1.0 + (transicion ? 0 : 0)); });
  cielo.position.copy(rig.position); estrellas.position.copy(rig.position);
  if (!renderer.xr.isPresenting) aplicarMirada();
  renderer.render(escenaActiva, camara);
}

/* ---------- vista previa en pantalla: mirar con el mouse ---------- */
let yaw = +(parametros.get('yaw') || 0), pitch = +(parametros.get('pitch') || 0), arrastrando = false, movido = 0;
window.__info = () => ({ tris: renderer.info.render.triangles, llamadas: renderer.info.render.calls });
function aplicarMirada(){ camara.rotation.set(pitch, yaw, 0, 'YXZ'); }
lienzo.addEventListener('pointerdown', e => { arrastrando = true; movido = 0; lienzo.setPointerCapture(e.pointerId); });
lienzo.addEventListener('pointermove', e => { if (!arrastrando) return; movido += Math.abs(e.movementX) + Math.abs(e.movementY); yaw -= e.movementX * .004; pitch = clamp(pitch - e.movementY * .004, -1.3, 1.3); });
lienzo.addEventListener('pointerup', () => { arrastrando = false; if (movido < 6 && document.body.classList.contains('viendo')) avanzar(); });
addEventListener('keydown', e => { if (e.code === 'Space' && document.body.classList.contains('viendo')){ e.preventDefault(); avanzar(); } });
addEventListener('resize', () => { camara.aspect = innerWidth / innerHeight; camara.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); ajustarHumo(); });
function ajustarHumo(){ matHumo.uniforms.uEsc.value = renderer.xr.isPresenting ? 760 : innerHeight * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camara.fov / 2))); }
ajustarHumo();

/* ---------- entrar en realidad virtual ---------- */
const btnVR = document.getElementById('entrarVR'), aviso = document.getElementById('avisoVR'), portada = document.getElementById('portada');
if (navigator.xr){
  navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    btnVR.disabled = !ok;
    aviso.textContent = ok ? 'Visor listo. Ponte el visor y aprieta el botón.' : 'Para la experiencia completa abre esta página en el navegador del Meta Quest. Aquí puedes verla en pantalla.';
  }).catch(() => { aviso.textContent = 'Este navegador no permite realidad virtual. Puedes verla en pantalla.'; });
} else aviso.textContent = 'Para la experiencia completa abre esta página en el navegador del Meta Quest. Aquí puedes verla en pantalla.';
let sesion = null;
btnVR.addEventListener('click', async () => {
  try {
    iniciarSonido(); oyente?.context.resume();
    sesion = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'layers'] });
    await renderer.xr.setSession(sesion); portada.classList.add('oculta'); camara.position.set(0, 0, 0); ajustarHumo();
    entrarEstacion(0); transicion = { fase: 'in', t: 0 };
    sesion.addEventListener('end', () => { sesion = null; portada.classList.remove('oculta'); camara.position.set(0, 1.6, 0); ajustarHumo(); });
  } catch (e) { aviso.textContent = 'No se pudo iniciar la realidad virtual: ' + e.message; }
});
for (let i = 0; i < 2; i++){ const c = renderer.xr.getController(i); c.addEventListener('select', avanzar); rig.add(c); }
document.getElementById('verAqui').addEventListener('click', () => { iniciarSonido(); oyente?.context.resume(); portada.classList.add('oculta'); document.body.classList.add('viendo'); entrarEstacion(0); transicion = { fase: 'in', t: 0 }; });
document.getElementById('salir').addEventListener('click', () => { document.body.classList.remove('viendo'); portada.classList.remove('oculta'); });

// parámetros de prueba: ?estacion=3&t=10&congelar
const congelar = parametros.has('congelar');
if (parametros.has('estacion')){ portada.classList.add('oculta'); entrarEstacion(+parametros.get('estacion')); tEst = +(parametros.get('t') || 0); transicion = null; velo.material.opacity = 0; }
else { entrarEstacion(0); }
if (document.fonts) document.fonts.ready.then(() => { pintarLateral(); Object.values(paneles).forEach(p => p.userData.dibujar(...p.userData.ultimo)); });
renderer.setAnimationLoop(cuadro);
</script>
</body>
